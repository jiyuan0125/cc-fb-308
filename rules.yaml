# 交易明细入库质量规则清单（业务方给定，检查口径以本文件内容为准）
规则清单:
  - 规则名: 金额为正
    字段: amount
    要求: 严格大于
    界限值: 0
  - 规则名: 币种在支持列表
    字段: currency
    要求: 取值属于
    允许值: [CNY, USD, EUR, JPY, GBP]
  - 规则名: 账户格式合规
    字段: account
    首字符: 英文字母
    后续字符: 数字
    后续位数: 10
  - 规则名: 批内交易号唯一
    字段: txn_id
    要求: 批内不重复
  - 规则名: 单批合计不超风控上限
    字段: amount
    要求: 合计不超过
    上限: 300000
